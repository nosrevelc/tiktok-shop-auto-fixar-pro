<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      width: 340px;
      padding: 16px;
      margin: 0;
      background: #121214;
      color: #f1f1f3;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    h2 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tag-pro {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #fe2c55;
      color: #fff;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    button.main-btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .start {
      background: #25d883;
      color: #07150e;
    }
    .start:hover {
      background: #22c376;
    }
    .stop {
      background: #fe2c55;
      color: #fff;
    }
    .stop:hover {
      background: #e0264b;
    }
    .card {
      background: #1c1c1f;
      border: 1px solid #2d2d32;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.7;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #a1a1aa;
    }
    .ok { color: #25d883; font-weight: 700; }
    .warn { color: #f59e0b; font-weight: 700; }
    .bad { color: #fe2c55; font-weight: 700; }
    .muted { color: #888891; font-size: 12px; margin-top: 6px; }

    .btn-mini {
      background: #2d2d32;
      color: #d4d4d8;
      border: none;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      margin-left: 8px;
    }
    .btn-mini:hover {
      background: #3f3f46;
      color: #fff;
    }

    .config-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 12px;
    }
    .config-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .config-row:last-child {
      margin-bottom: 0;
    }
    select {
      background: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
      outline: none;
    }

    .credits {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #27272a;
      text-align: center;
      font-size: 11px;
      color: #71717a;
    }
    .credits a {
      color: #a1a1aa;
      text-decoration: none;
    }
    .credits a:hover {
      text-decoration: underline;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>TikTok Auto Fixar <span class="tag-pro">PRO</span></h2>
  </div>

  <button id="toggle" class="main-btn start">ATIVAR AUTO FIXAR</button>

  <div class="card">
    <div class="row">
      <span class="label">Status:</span>
      <span id="state" class="bad">DESATIVADO</span>
    </div>
    <div class="row">
      <span class="label">Botão +60s na tela:</span>
      <span id="found" class="warn">—</span>
    </div>
    <div class="row">
      <span class="label">Total de Renovações:</span>
      <span>
        <b id="count" style="font-size:14px; color:#25d883;">0</b>
        <button id="btnReset" class="btn-mini" title="Zerar contador">Zerar</button>
      </span>
    </div>
    <div class="row">
      <span class="label">Última renovação:</span>
      <b id="last">—</b>
    </div>
    <div id="msg" class="muted">Abra o TikTok Shop Live Console para monitorar.</div>
  </div>

  <div class="config-card">
    <div class="config-row">
      <span class="label">Intervalo de proteção:</span>
      <select id="selCooldown">
        <option value="5">5 segundos</option>
        <option value="8" selected>8 segundos (padrão)</option>
        <option value="10">10 segundos</option>
        <option value="15">15 segundos</option>
      </select>
    </div>
    <div class="config-row">
      <span class="label">Bip sonoro ao renovar:</span>
      <label style="display:flex; align-items:center; cursor:pointer;">
        <input type="checkbox" id="chkSound" checked>
      </label>
    </div>
  </div>

  <div class="credits">
    Original por <b>Uélinton Morelli</b> (<a href="https://www.instagram.com/soumorelli" target="_blank" rel="noopener noreferrer">@soumorelli</a>)<br>
    Melhorias PRO por cortesia de <a href="https://bomsite.shop" target="_blank" rel="noopener noreferrer"><b>bomsite.shop</b></a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
