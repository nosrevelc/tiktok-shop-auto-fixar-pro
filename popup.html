<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
body{font-family:Arial,sans-serif;width:330px;padding:16px;background:#111;color:#fff}
h2{font-size:18px;margin:0 0 14px}
button{width:100%;border:0;border-radius:8px;padding:12px;font-weight:700;cursor:pointer}
.start{background:#25d883;color:#07150e}.stop{background:#ff375f;color:#fff}
.card{background:#1d1d1d;border-radius:8px;padding:12px;margin-top:12px;font-size:13px;line-height:1.6}
.ok{color:#3ee68c}.warn{color:#ffcc4d}.bad{color:#ff6b86}.muted{color:#aaa}
.credits{margin-top:14px;padding-top:11px;border-top:1px solid #333;text-align:center;font-size:12px;color:#aaa}
.credits a{color:#fff;text-decoration:none}.credits a:hover{text-decoration:underline}
</style>
</head>
<body>
<h2>TikTok Shop Auto Fixar V3</h2>
<button id="toggle" class="start">ATIVAR AUTO FIXAR</button>
<div class="card">
<div>Estado: <b id="state">DESATIVADO</b></div>
<div>Botão +60s: <b id="found">—</b></div>
<div>Renovações: <b id="count">0</b></div>
<div>Último clique: <b id="last">—</b></div>
<div id="msg" class="muted">Abra o Console de LIVE e ative.</div>
</div>
<div class="credits">
Criado por <b>Uélinton Morelli</b><br>
<a href="https://www.instagram.com/soumorelli" target="_blank" rel="noopener noreferrer">@soumorelli</a>
</div>
<script src="popup.js"></script>
</body>
</html>
